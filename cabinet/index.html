<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Личный кабинет | MapEditor</title>
    <meta name="description" content="Личный кабинет MapEditor: профиль Discord и уровень доступа.">
    <link rel="icon" type="image/svg+xml" href="../icon.svg">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #030712; color: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, sans-serif; padding: 20px; }
        body:before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .42; background-image: linear-gradient(rgba(51,65,85,.18) 1px, transparent 1px), linear-gradient(90deg, rgba(51,65,85,.18) 1px, transparent 1px); background-size: 48px 48px; }
        .card { position: relative; z-index: 1; width: min(440px, 100%); background: rgba(15,23,42,.8); border: 1px solid rgba(148,163,184,.16); border-radius: 24px; padding: 32px; text-align: center; backdrop-filter: blur(18px); box-shadow: 0 28px 80px rgba(0,0,0,.4); }
        .avatar { width: 96px; height: 96px; border-radius: 50%; border: 3px solid rgba(88,101,242,.6); box-shadow: 0 0 30px rgba(88,101,242,.35); object-fit: cover; }
        .avatar-fallback { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; font-size: 40px; font-weight: 800; background: rgba(88,101,242,.15); border: 3px solid rgba(88,101,242,.6); color: #c7d2fe; }
        h1 { margin: 16px 0 4px; font-size: 24px; letter-spacing: -.02em; }
        .sub { color: #94a3b8; font-size: 13px; margin-bottom: 18px; }
        .role { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; padding: 6px 14px; border-radius: 999px; margin-bottom: 22px; }
        .role.user { color: #6ee7b7; background: rgba(16,185,129,.1); border: 1px solid rgba(52,211,153,.3); }
        .role.moderator { color: #93c5fd; background: rgba(59,130,246,.1); border: 1px solid rgba(96,165,250,.3); }
        .role.admin { color: #fda4af; background: rgba(244,63,114,.1); border: 1px solid rgba(244,63,114,.3); }
        .btn { display: inline-block; text-decoration: none; font-weight: 700; font-size: 14px; padding: 12px 24px; border-radius: 12px; transition: transform .15s ease, background .15s ease; }
        .btn:hover { transform: translateY(-2px); }
        .btn-discord { background: #5865F2; color: #fff; }
        .btn-discord:hover { background: #4752c4; }
        .btn-ghost { background: rgba(148,163,184,.1); color: #cbd5e1; border: 1px solid rgba(148,163,184,.25); margin-left: 8px; }
        .links { margin-top: 22px; font-size: 13px; }
        .links a { color: #34d399; text-decoration: none; margin: 0 8px; }
        .error { display: none; background: rgba(244,63,114,.1); border: 1px solid rgba(244,63,114,.35); color: #fda4af; font-size: 13px; border-radius: 12px; padding: 10px 14px; margin-bottom: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="error" id="authError"></div>
        <div id="profile"><p class="sub">Загрузка…</p></div>
        <div class="links"><a href="/">← На главную</a></div>
    </div>
<script>
(function() {
    var profile = document.getElementById('profile');
    var errBox = document.getElementById('authError');
    var params = new URLSearchParams(location.search);
    var err = params.get('error');
    if (err) {
        var texts = { state: 'Ошибка проверки входа, попробуйте ещё раз.', exchange: 'Discord отклонил код входа.', profile: 'Не удалось получить профиль Discord.', config: 'Авторизация ещё не настроена на сервере.', internal: 'Внутренняя ошибка, попробуйте позже.' };
        errBox.textContent = texts[err] || 'Ошибка входа.';
        errBox.style.display = 'block';
    }
    var roleNames = { user: 'Пользователь', moderator: 'Модератор', admin: 'Администратор' };
    fetch('/api/me').then(function(r) {
        if (!r.ok) throw new Error('guest');
        return r.json();
    }).then(function(d) {
        if (!d.user) throw new Error('guest');
        var u = d.user;
        var avatar = u.avatar
            ? '<img class="avatar" src="https://cdn.discordapp.com/avatars/' + u.id + '/' + u.avatar + '.png?size=256" alt="">'
            : '<div class="avatar-fallback">' + (u.username || '?').charAt(0).toUpperCase() + '</div>';
        profile.innerHTML = avatar + '<h1></h1><div class="sub">Discord ID: ' + u.id + '</div>' +
            '<div><span class="role ' + u.role + '">' + (roleNames[u.role] || u.role) + '</span></div>' +
            '<a class="btn btn-ghost" href="/api/auth/logout">Выйти</a>';
        profile.querySelector('h1').textContent = u.username;
    }).catch(function() {
        profile.innerHTML = '<h1>Вы не вошли</h1><p class="sub">Войдите через Discord, чтобы открыть кабинет.</p>' +
            '<a class="btn btn-discord" href="/api/auth/login">Войти через Discord</a>';
    });
})();
</script>
</body>
</html>
